# ===============================
# APPLICATION
# ===============================
spring.application.name=quantity-measurement-app
server.port=8081

# ===============================
# DATABASE (H2 for easy development)
# ===============================
spring.datasource.url=jdbc:h2:mem:quantitydb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===============================
# H2 Console
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# ===============================
# LOGGING (DEBUG MODE)
# ===============================
logging.level.root=INFO
logging.level.com.quantity_measurement_app=DEBUG
logging.level.org.springframework.security=DEBUG

# ===============================
# JWT CONFIG (DEV)
# ===============================
jwt.secret=${JWT_SECRET:mySecretKeyForJWT}
jwt.expiration=86400000

# ===============================
# GOOGLE OAUTH2 (DEV)
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

app.oauth2.redirect-uri=http://localhost:3000
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD}

